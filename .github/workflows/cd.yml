name: Continuous Deployment

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: production
      url: https://muzusi.site

    steps:
      # 1. 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Node.js 환경 설정
      # ci.yml과 동일한 버전으로 맞춤 (ci.yml에서 jsdom 관련 의존성이
      # Node 18을 지원 안 해 22로 올린 것과 같은 이유 - 두 워크플로우가
      # 서로 다른 Node 버전을 쓰면 나중에 또 버전 불일치 문제가 생길 수 있음)
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22

      # 3. 환경 변수 적용 후 의존성 설치 및 빌드
      - name: Install dependencies and build with environment variables
        env:
          VITE_KAKAO_REST_API_KEY: ${{ secrets.VITE_KAKAO_REST_API_KEY }}
          VITE_KAKAO_REDIRECT_URI: ${{ secrets.VITE_KAKAO_REDIRECT_URI }}
          VITE_NAVER_REST_API_KEY: ${{ secrets.VITE_NAVER_REST_API_KEY }}
          VITE_NAVER_REDIRECT_URI: ${{ secrets.VITE_NAVER_REDIRECT_URI }}
          VITE_SERVER_BASE_URL: ${{ secrets.VITE_SERVER_BASE_URL }}
          VITE_WEB_SOCKET_URL: ${{ secrets.VITE_WEB_SOCKET_URL }}

        run: |
          npm install
          npm run build

      # 4. 빌드 파일 전송 (배포 파일 업로드)
      - name: Copy build files
        uses: appleboy/scp-action@v0.1.6
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          key: ${{ secrets.SERVER_KEY }}
          source: dist/*
          target: /var/www/muzusi-web/

      # 5. 서버 설정 및 Nginx 재시작
      - name: Deploy to server
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          key: ${{ secrets.SERVER_KEY }}
          script: |
            sudo systemctl restart nginx
