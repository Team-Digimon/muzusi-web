name: Continuous Integration

on:
  pull_request:
    branches:
      - develop # develop 브랜치로 PR 시 실행

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      # 1. 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Node.js 환경 설정
      # jsdom이 의존하는 html-encoding-sniffer@6이 ESM 전용 패키지(@exodus/bytes)를
      # 써서 Node 18에서는 ERR_REQUIRE_ESM으로 테스트 단계가 크래시한다
      # (엔진 요구사항: ^20.19.0 || ^22.12.0 || >=24.0.0). 22로 올려서 해결.
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22

      # 3. 의존성 설치
      - name: Install dependencies
        run: npm install

      # 4. Lint
      - name: Lint
        run: npm run lint

      # 5. 타입 체크 (빌드는 타입 에러가 있어도 통과할 수 있어 별도 확인 필요)
      - name: Type check
        run: npx tsc --noEmit

      # 6. 테스트 + 커버리지 측정
      - name: Test with coverage
        run: npm run test:coverage

      # 7. 빌드 수행
      - name: Build project
        run: npm run build

      # 8. 커버리지 리포트를 CI 아티팩트로 업로드 (PR에서 다운받아 확인 가능)
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
